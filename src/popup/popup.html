<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; }
  section { margin-bottom: 10px; }
  #status, #fen { color: #444; }
  #fen { font-family: monospace; font-size: 11px; word-break: break-all; }
  select { display: block; width: 100%; margin-top: 2px; }
  .hint { font-size: 11px; color: #666; margin-top: 4px; }
  .tos { font-size: 11px; color: #92400e; margin: 0; }
</style>
</head>
<body>
<section><label><input type="checkbox" id="enabled"> Show move hints</label></section>
<section>
  <div id="status"></div>
</section>
<section>
  <label for="sims">Search strength</label>
  <select id="sims">
    <option value="0">Off — raw policy (instant)</option>
    <option value="32">32 (~1 s)</option>
    <option value="64">64 (~2 s)</option>
    <option value="128">128 (~3–4 s) — default</option>
    <option value="256">256 (~7 s)</option>
  </select>
  <div class="hint">More simulations find tactics the raw policy misses, but the arrow takes
  longer to update. The net was measured at 200 simulations, so 128 plays a little below its
  full strength and 256 slightly above.</div>
</section>
<section id="fen"></section>
<p class="tos">For analysis boards, puzzles, unrated/friendly and bot games only.</p>
<script src="popup.js"></script>
</body>
</html>
